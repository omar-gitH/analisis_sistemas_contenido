[build]
  command = "npm run build"
  publish = "dist"

# Redirección SPA: Todas las rutas se redirigen a /index.html con código HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados para Service Worker (PWA): sin caché para asegurar actualizaciones inmediatas
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Encabezados para Manifiesto PWA
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Encabezados de seguridad para todos los recursos
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
